
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030a12">

<title>Nova senha | KILLIKPAY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #030a12;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
}

.panel {
    width: 100%;
    max-width: 370px;
    background: #071321;
    border: 9px solid #000;
    border-radius: 49px;
    padding: 38px 23px 32px;
}

.logo {
    display: block;
    width: 175px;
    max-width: 80%;
    height: auto;
    object-fit: contain;
    margin: 0 auto 35px;
}

h1 {
    font-size: 23px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    color: #969eaa;
    font-size: 12px;
    line-height: 1.7;
    text-align: center;
    margin-bottom: 28px;
}

.field {
    margin-bottom: 17px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 9px;
}

.input-wrap {
    position: relative;
}

input {
    width: 100%;
    height: 49px;
    padding: 0 48px 0 14px;
    background: #030a12;
    border: 1px solid #292929;
    border-radius: 11px;
    outline: none;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    transition: .2s;
}

input:focus {
    border-color: #20baf0;
}

input::placeholder {
    color: #68717d;
}

.toggle {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #969eaa;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
}

button.submit {
    width: 100%;
    height: 49px;
    background: #20baf0;
    color: #00111b;
    border: none;
    border-radius: 11px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 7px;
    transition: .2s;
}

button.submit:hover {
    opacity: .9;
}

button.submit:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 11px;
    line-height: 1.6;
    margin-bottom: 17px;
}

.message.error {
    display: block;
    background: rgba(255, 70, 70, .10);
    border: 1px solid rgba(255, 70, 70, .3);
    color: #ff7777;
}

.message.success {
    display: block;
    background: rgba(32, 186, 120, .10);
    border: 1px solid rgba(32, 186, 120, .3);
    color: #42d99b;
}

.back {
    display: block;
    text-align: center;
    color: #20baf0;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    margin-top: 23px;
}

.back:hover {
    opacity: .8;
}

.footer {
    text-align: center;
    color: #68717d;
    font-size: 10px;
    margin-top: 27px;
}

@media (max-height: 650px) {
    body {
        align-items: flex-start;
    }

    .panel {
        margin: 10px auto;
        padding-top: 25px;
    }

    .logo {
        margin-bottom: 22px;
    }
}
</style>
</head>

<body>

<div class="panel">

    <img
        src="assets/lowticketpay.png"
        alt="KILLIKPAY"
        class="logo"
    >

    <h1>Nova senha</h1>

    <p class="subtitle">
        Cria uma nova senha para voltares a aceder
        à tua conta KILLIKPAY.
    </p>

    <div id="message" class="message"></div>

    <form id="resetForm" style="display:none;">

        <div class="field">
            <label for="password">Nova senha</label>

            <div class="input-wrap">
                <input
                    type="password"
                    id="password"
                    placeholder="Introduz a nova senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    onclick="togglePassword('password', this)"
                >Mostrar</button>
            </div>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirmar nova senha</label>

            <div class="input-wrap">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repete a nova senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    onclick="togglePassword('confirmPassword', this)"
                >Mostrar</button>
            </div>
        </div>

        <button
            type="submit"
            class="submit"
            id="submitButton"
        >
            ALTERAR SENHA
        </button>

    </form>

    <a href="index.html" class="back">
        Voltar ao Login
    </a>

    <div class="footer">
        © KILLIKPAY — Todos os direitos reservados.
    </div>

</div>

<script type="module">

import { auth } from "./js/firebase.js";

import {
    verifyPasswordResetCode,
    confirmPasswordReset
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");

const params = new URLSearchParams(window.location.search);

const mode = params.get("mode");
const oobCode = params.get("oobCode");

let validCode = false;


function showMessage(text, type) {

    message.textContent = text;
    message.className = "message " + type;
}


function togglePassword(id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "Ocultar";
    } else {
        input.type = "password";
        button.textContent = "Mostrar";
    }
}

window.togglePassword = togglePassword;


/* VALIDAR CÓDIGO RECEBIDO */

async function validateCode() {

    if (mode !== "resetPassword" || !oobCode) {

        showMessage(
            "Link de recuperação inválido ou incompleto. Solicita um novo link.",
            "error"
        );

        return;
    }

    try {

        await verifyPasswordResetCode(auth, oobCode);

        validCode = true;

        form.style.display = "block";

    } catch (error) {

        console.error("Erro ao validar recuperação:", error);

        showMessage(
            "Este link expirou ou já foi utilizado. Solicita uma nova recuperação de senha.",
            "error"
        );
    }
}


/* ALTERAR SENHA */

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    if (!validCode) {
        showMessage(
            "O código de recuperação não é válido.",
            "error"
        );
        return;
    }

    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    if (password.length < 6) {

        showMessage(
            "A senha deve ter pelo menos 6 caracteres.",
            "error"
        );

        return;
    }

    if (password !== confirmPassword) {

        showMessage(
            "As senhas não coincidem.",
            "error"
        );

        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "A ALTERAR...";

    try {

        await confirmPasswordReset(
            auth,
            oobCode,
            password
        );

        showMessage(
            "Senha alterada com sucesso! Já podes entrar na tua conta.",
            "success"
        );

        form.style.display = "none";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 2500);

    } catch (error) {

        console.error("Erro ao alterar senha:", error);

        let errorMessage =
            "Não foi possível alterar a senha. Solicita um novo link.";

        if (error.code === "auth/weak-password") {
            errorMessage = "A senha é demasiado fraca.";
        }

        showMessage(errorMessage, "error");

        submitButton.disabled = false;
        submitButton.textContent = "ALTERAR SENHA";
    }

});

validateCode();

</script>

</body>
</html>
