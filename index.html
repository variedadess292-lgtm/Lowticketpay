
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030a12">

<title>Entrar | KILLIKPAY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#030a12;
    color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 16px;
}

/* ESTRUTURA PRINCIPAL */

.container{
    width:100%;
    max-width:340px;
    min-height:630px;
    background:#071321;
    border:9px solid #000;
    border-radius:30px;
    overflow:hidden;
    position:relative;
    box-shadow:0 25px 65px rgba(0,0,0,.4);
}

/* ÁREA SUPERIOR */

.login-screen{
    min-height:612px;
    height:100%;
    padding:55px 25px 30px;
    background:#071321;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* LOGO */

.logo-area{
    width:100%;
    min-height:235px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.logo{
    width:165px;
    max-height:110px;
    object-fit:contain;
}

.brand-caption{
    color:#969eaa;
    font-size:9px;
    letter-spacing:1.3px;
    margin-top:13px;
    text-transform:uppercase;
}

/* FORMULÁRIO */

.form-area{
    width:100%;
    margin-top:10px;
}

.title{
    text-align:center;
    font-size:18px;
    font-weight:800;
    margin-bottom:27px;
    color:#fff;
}

.field{
    width:100%;
    margin-bottom:13px;
    position:relative;
}

.input-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#969eaa;
    width:15px;
    height:15px;
    pointer-events:none;
}

input{
    width:100%;
    height:47px;
    border:1px solid #292929;
    outline:none;
    border-radius:15px;
    background:#030a12;
    color:#fff;
    padding:0 17px 0 43px;
    font-family:inherit;
    font-size:10px;
    transition:.2s;
}

input::placeholder{
    color:#969eaa;
}

input:focus{
    border-color:#20baf0;
    box-shadow:0 0 0 3px rgba(32,186,240,.1);
}

.password-input{
    padding-right:70px;
}

.toggle{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:#20baf0;
    font-family:inherit;
    font-size:9px;
    font-weight:700;
    cursor:pointer;
}

/* RECUPERAÇÃO */

.forgot{
    display:block;
    text-align:right;
    color:#969eaa;
    font-size:9px;
    text-decoration:none;
    margin:17px 5px 23px;
}

.forgot span{
    color:#20baf0;
    font-weight:700;
}

/* BOTÃO */

.login-btn{
    width:100%;
    height:47px;
    border:none;
    border-radius:30px;
    background:#20baf0;
    color:#030a12;
    font-family:inherit;
    font-size:10px;
    font-weight:800;
    letter-spacing:.5px;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#55cbf5;
}

.login-btn:disabled{
    opacity:.6;
    cursor:wait;
}

/* MENSAGENS */

.message{
    display:none;
    width:100%;
    padding:11px 13px;
    border-radius:10px;
    font-size:10px;
    line-height:1.5;
    margin-bottom:15px;
}

.message.error{
    display:block;
    background:#351616;
    color:#ffb0b0;
    border:1px solid #572323;
}

.message.success{
    display:block;
    background:#102b20;
    color:#a5f3c0;
    border:1px solid #205338;
}

/* CRIAR CONTA */

.register{
    text-align:center;
    color:#969eaa;
    font-size:9px;
    margin-top:34px;
}

.register a{
    color:#20baf0;
    font-weight:800;
    text-decoration:none;
}

/* RODAPÉ */

.footer{
    text-align:center;
    color:#657080;
    font-size:8px;
    margin-top:auto;
    padding-top:25px;
}

/* RESPONSIVIDADE */

@media(max-height:700px){

    .container{
        min-height:570px;
    }

    .login-screen{
        min-height:552px;
        padding-top:35px;
    }

    .logo-area{
        min-height:190px;
    }
}

@media(max-width:360px){

    .container{
        max-width:320px;
    }

    .login-screen{
        padding-left:20px;
        padding-right:20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <main class="login-screen">

        <!-- LOGOTIPO -->
        <div class="logo-area">

            <img
                src="assets/lowticketpay.png"
                alt="KILLIKPAY"
                class="logo"
            >

            <p class="brand-caption">
                Bem vindo de volta! 
            </p>

        </div>

        <!-- FORMULÁRIO -->
        <div class="form-area">

            <h1 class="title">Entrar na sua conta</h1>

            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite">
            </div>

            <form id="loginForm">

                <!-- EMAIL -->
                <div class="field">

                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M16 12v1.5a2 2 0 0 0 4 0V12"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                    <input
                        type="email"
                        id="email"
                        placeholder="E-mail"
                        autocomplete="username"
                        required
                    >

                </div>

                <!-- PALAVRA-PASSE -->
                <div class="field">

                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <rect x="5" y="10" width="14" height="11" rx="2"/>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                        <circle cx="12" cy="15" r="1"/>
                    </svg>

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Palavra-passe"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="togglePassword">
                        Mostrar
                    </button>

                </div>

                <a href="esqueceu-senha.html" class="forgot">
                    Esqueceu a palavra-passe?
                    <span>Recuperar</span>
                </a>

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn">
                    ENTRAR 
                </button>

            </form>

            <div class="register">
                Ainda não tem conta?
                <a href="criar-conta.html">Criar conta</a>
            </div>

        </div>

        <div class="footer">
            © 2026 KILLIKPAY. Todos os direitos reservados.
        </div>

    </main>

</div>

<!-- FIREBASE -->
<script type="module">

import { auth } from "./js/firebase.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");

let submitting = false;

/* MENSAGENS */

function showMessage(text,type="error"){

    message.textContent = text;
    message.className = "message " + type;

}

function translateError(error){

    const errors = {

        "auth/invalid-email":
            "O endereço de e-mail é inválido.",

        "auth/user-not-found":
            "Não existe uma conta com este e-mail.",

        "auth/wrong-password":
            "Palavra-passe incorrecta.",

        "auth/invalid-credential":
            "E-mail ou palavra-passe incorrectos.",

        "auth/too-many-requests":
            "Demasiadas tentativas. Tente novamente mais tarde.",

        "auth/network-request-failed":
            "Erro de ligação. Verifique a internet.",

        "auth/user-disabled":
            "Esta conta foi desactivada.",

        "auth/operation-not-allowed":
            "O acesso por e-mail não está activado no Firebase."

    };

    return errors[error.code] ||
        "Não foi possível entrar. Tente novamente.";

}

/* MOSTRAR / OCULTAR SENHA */

togglePassword.addEventListener("click",()=>{

    const visible = passwordInput.type === "text";

    passwordInput.type = visible ? "password" : "text";

    togglePassword.textContent =
        visible ? "Mostrar" : "Ocultar";

});

/* LOGIN */

form.addEventListener("submit",async event=>{

    event.preventDefault();

    if(submitting) return;

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if(!email || !password){

        showMessage("Preencha todos os campos.");
        return;

    }

    submitting = true;

    loginBtn.disabled = true;
    loginBtn.textContent = "A ENTRAR...";

    message.className = "message";

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        showMessage(
            "Login realizado com sucesso!",
            "success"
        );

        window.location.replace("dashboard.html");

    }catch(error){

        console.error("Erro de login:",error);

        showMessage(translateError(error));

        submitting = false;

        loginBtn.disabled = false;
        loginBtn.textContent = "ENTRAR NA CONTA";

    }

});

</script>

</body>
</html>
