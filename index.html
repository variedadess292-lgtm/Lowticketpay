
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030a12">

<title>Entrar | KILLIKPAY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#e9edf2;
    font-family:'Plus Jakarta Sans',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 16px;
    color:#111;
}

.container{
    width:100%;
    max-width:360px;
    background:#fff;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 20px 55px rgba(3,10,18,.13);
}

/* TOPO DA LOGO */

.brand-cover{
    height:190px;
    background:#030a12;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

/* Decoração do fundo */

.brand-cover::before,
.brand-cover::after{
    content:"";
    position:absolute;
    border:1px solid rgba(32,186,240,.12);
    border-radius:50%;
}

.brand-cover::before{
    width:260px;
    height:260px;
    top:-145px;
    left:-100px;
}

.brand-cover::after{
    width:220px;
    height:220px;
    right:-100px;
    bottom:-130px;
}

.logo-box{
    width:82px;
    height:82px;
    background:#fff;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:2;
    padding:12px;
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* ÁREA BRANCA */

.content{
    background:#fff;
    margin-top:-27px;
    position:relative;
    z-index:3;
    border-radius:35px 0 0;
    padding:34px 22px 29px;
}

.title{
    text-align:center;
    font-size:21px;
    font-weight:600;
    margin-bottom:8px;
    color:#111;
}

.subtitle{
    text-align:center;
    font-size:11px;
    color:#888;
    line-height:1.6;
    margin-bottom:27px;
}

/* MENSAGEM */

.message{
    display:none;
    padding:11px 12px;
    border-radius:9px;
    font-size:11px;
    line-height:1.5;
    margin-bottom:17px;
}

.message.error{
    display:block;
    background:#fff0f0;
    color:#c83232;
}

.message.success{
    display:block;
    background:#eaf9ef;
    color:#188343;
}

/* CAMPOS */

.field{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:10px;
    font-weight:700;
    color:#333;
    margin:0 0 7px 2px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:48px;
    background:#fafafa;
    border:1px solid #eeeeee;
    border-radius:10px;
    padding:0 13px;
    font-family:inherit;
    font-size:11px;
    color:#111;
    outline:none;
    transition:.2s;
}

input::placeholder{
    color:#aaa;
}

input:focus{
    border-color:#20baf0;
    background:#fff;
    box-shadow:0 0 0 3px rgba(32,186,240,.08);
}

.password-input{
    padding-right:70px;
}

.toggle{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#168fbd;
    font-family:inherit;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
}

/* RECUPERAÇÃO */

.forgot{
    display:block;
    text-align:right;
    color:#168fbd;
    font-size:10px;
    font-weight:700;
    text-decoration:none;
    margin-top:-4px;
    margin-bottom:21px;
}

/* BOTÃO */

.login-btn{
    width:100%;
    height:47px;
    border:0;
    border-radius:9px;
    background:#030a12;
    color:#fff;
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 5px 12px rgba(3,10,18,.12);
}

.login-btn:hover{
    background:#102237;
}

.login-btn:disabled{
    opacity:.6;
    cursor:wait;
}

/* REGISTO */

.register{
    text-align:center;
    font-size:10px;
    color:#777;
    margin-top:28px;
}

.register a{
    color:#168fbd;
    font-weight:800;
    text-decoration:none;
}

/* RODAPÉ */

.footer{
    text-align:center;
    color:#aaa;
    font-size:9px;
    padding:0 15px 20px;
    background:#fff;
}

@media(max-width:380px){

    .container{
        max-width:340px;
    }

    .brand-cover{
        height:180px;
    }

    .content{
        padding:31px 20px 27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand-cover">

        <div class="logo-box">
            <img src="assets/lowticketpay.png" alt="KILLIKPAY">
        </div>

    </div>

    <div class="content">

        <h1 class="title">Entrar</h1>

        <p class="subtitle">
            Aceda à sua conta KILLIKPAY
        </p>

        <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite">
        </div>

        <form id="loginForm">

            <div class="field">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="seuemail@exemplo.com"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="field">

                <label for="password">Palavra-passe</label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Introduza a sua palavra-passe"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="togglePassword">
                        Mostrar
                    </button>

                </div>

            </div>

            <a href="esqueceu-senha.html" class="forgot">
                Esqueceu a palavra-passe?
            </a>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn">
                Entrar na conta
            </button>

        </form>

        <div class="register">
            Ainda não tem conta?
            <a href="criar-conta.html">Criar conta</a>
        </div>

    </div>

    <div class="footer">
        © 2026 KILLIKPAY. Todos os direitos reservados.
    </div>

</div>

<script type="module">

import { auth } from "./js/firebase.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");

let submitting = false;

function showMessage(text,type="error"){
    message.textContent = text;
    message.className = "message " + type;
}

function translateError(error){

    const errors = {
        "auth/invalid-email":
            "O endereço de e-mail é inválido.",

        "auth/user-not-found":
            "Não existe uma conta com este e-mail.",

        "auth/wrong-password":
            "Palavra-passe incorrecta.",

        "auth/invalid-credential":
            "E-mail ou palavra-passe incorrectos.",

        "auth/too-many-requests":
            "Demasiadas tentativas. Tente novamente mais tarde.",

        "auth/network-request-failed":
            "Erro de ligação. Verifique a internet.",

        "auth/user-disabled":
            "Esta conta foi desactivada.",

        "auth/operation-not-allowed":
            "O acesso por e-mail não está activado no Firebase."
    };

    return errors[error.code] ||
        "Não foi possível entrar. Tente novamente.";
}

/* MOSTRAR / OCULTAR SENHA */

togglePassword.addEventListener("click",()=>{

    const visible = passwordInput.type === "text";

    passwordInput.type = visible ? "password" : "text";

    togglePassword.textContent =
        visible ? "Mostrar" : "Ocultar";

});

/* LOGIN FIREBASE */

form.addEventListener("submit",async event=>{

    event.preventDefault();

    if(submitting) return;

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if(!email || !password){
        showMessage("Preencha todos os campos.");
        return;
    }

    submitting = true;

    loginBtn.disabled = true;
    loginBtn.textContent = "A entrar...";

    message.className = "message";

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        showMessage(
            "Login realizado com sucesso!",
            "success"
        );

        window.location.replace("dashboard.html");

    }catch(error){

        console.error("Erro de login:",error);

        showMessage(translateError(error));

        submitting = false;

        loginBtn.disabled = false;
        loginBtn.textContent = "Entrar na conta";

    }

});

</script>

</body>
</html>
