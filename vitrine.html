
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030a12">
<title>KLIKPay - Vitrine</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#030a12;
    color:#fff;
    min-height:100vh;
}

/* BARRA SUPERIOR */
.top-toolbar{
    width:100%;
    height:85px;
    padding:0 7.5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#030a12;
}

.toolbar-left{display:flex;align-items:center}

.toolbar-button{
    width:40px;height:40px;
    background:transparent;border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
}

.toolbar-button svg{
    width:40px;height:40px;
    fill:none;stroke:#858585;stroke-width:2.5;
    stroke-linecap:round;stroke-linejoin:round;
}

/* MENU LATERAL */
.menu-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.72);
    opacity:0;visibility:hidden;
    transition:.3s ease;z-index:998;
}

.menu-overlay.active{opacity:1;visibility:visible}

.side-menu{
    position:fixed;top:0;left:0;
    width:240px;max-width:85%;
    height:100vh;height:100dvh;
    background:#030a12;
    border-right:1px solid #292929;
    padding:25px 18px;
    transform:translateX(-100%);
    transition:transform .3s ease;
    z-index:999;overflow-y:auto;
}

.side-menu.active{transform:translateX(0)}

.menu-header{
    display:flex;align-items:center;
    justify-content:space-between;
    padding:5px 0 20px;margin-bottom:20px;
    border-bottom:1px solid #242a32;
}

.menu-logo{
    width:115px;max-height:36px;
    object-fit:contain;object-position:left center;
}

.menu-close{
    background:transparent;border:none;
    color:#969eaa;font-size:30px;
    cursor:pointer;line-height:1;
}

.menu-links{display:flex;flex-direction:column;gap:9px}

.menu-links a{
    display:flex;align-items:center;gap:14px;
    padding:15px 13px;border-radius:9px;
    color:#969eaa;text-decoration:none;
    font-size:14px;font-weight:700;
    transition:.2s ease;
}

.menu-links a svg{
    width:21px;height:21px;min-width:21px;
    flex-shrink:0;fill:none;stroke:currentColor;
    stroke-width:1.8;stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-links a:hover,
.menu-links a.active{
    background:#102237;color:#20baf0;
}

/* CONTEÚDO */
.main{
    width:100%;max-width:1250px;
    margin:auto;padding:30px;
}

.topbar{margin-bottom:30px}

h1{font-size:23px;font-weight:800}

.subtitle{
    color:#969eaa;font-size:12px;margin-top:7px;
}

/* PESQUISA */
.search-box{
    display:flex;align-items:center;gap:12px;
    background:#091522;border:1px solid #292929;
    border-radius:8px;padding:0 15px;
    height:46px;margin-bottom:20px;
}

.search-box span{color:#969eaa;font-size:21px}

.search-box input{
    width:100%;background:transparent;
    border:0;outline:none;color:#fff;
    font-family:inherit;font-size:12px;
}

.search-box input::placeholder{color:#777}

/* CATEGORIAS */
.categories{
    display:flex;align-items:center;gap:9px;
    overflow-x:auto;padding-bottom:5px;
    margin-bottom:27px;scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.category{
    flex-shrink:0;padding:9px 16px;
    border:1px solid #292929;border-radius:7px;
    background:#091522;color:#969eaa;
    font-family:inherit;font-size:11px;
    font-weight:600;cursor:pointer;transition:.2s;
}

.category:hover{border-color:#20baf0}

.category.active{
    background:#102237;color:#20baf0;
    border-color:#20baf0;
}

/* PRODUTOS */
.section-title{
    display:flex;justify-content:space-between;
    align-items:center;margin-bottom:17px;
}

.section-title h3{font-size:15px}

.section-title span{font-size:11px;color:#969eaa}

.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
}

.product{
    background:#091522;border:1px solid #292929;
    border-radius:10px;overflow:hidden;
    transition:.2s;min-width:0;
}

.product:hover{border-color:#34485b}

/* IMAGEM ADAPTÁVEL */
.product-image{
    width:100%;
    height:220px;
    background:#091522;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:10px;
    transition:height .2s ease;
}

.product-image.portrait{height:270px}
.product-image.landscape{height:190px}
.product-image.square{height:220px}

.product-image img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    background:transparent;
}

.product-image .material-icons-outlined{
    font-size:40px;color:#526174;
}

/* INFORMAÇÕES */
.product-info{padding:15px}

.product-info h4{
    font-size:13px;margin-bottom:7px;line-height:1.5;
}

.description{
    font-size:11px;color:#969eaa;
    line-height:1.6;margin-bottom:15px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

/* ORDER BUMP E UPSELL */
.product-offers{
    display:flex;flex-wrap:wrap;
    gap:6px;margin:0 0 13px;
}

.offer-tag{
    display:inline-flex;align-items:center;gap:5px;
    padding:6px 9px;border-radius:5px;
    font-size:9px;font-weight:800;
    background:#102237;color:#20baf0;
    border:1px solid #19445e;
}

.offer-tag.upsell{
    background:#17291f;color:#49d18b;
    border-color:#28583e;
}

/* PREÇO */
.product-bottom{
    display:flex;justify-content:space-between;
    align-items:center;gap:8px;
}

.price{font-size:14px;font-weight:800;white-space:nowrap}

/* AÇÕES */
.product-actions{
    display:flex;flex-direction:column;
    gap:9px;margin-top:13px;
}

.buy{
    display:flex;align-items:center;
    justify-content:center;width:100%;
    min-height:38px;background:#20baf0;
    color:#030a12;border:0;padding:9px 12px;
    border-radius:6px;font-size:11px;
    font-weight:800;cursor:pointer;
    text-decoration:none;white-space:nowrap;
}

.copy-affiliate{
    display:flex;align-items:center;
    justify-content:center;gap:7px;
    width:100%;min-height:36px;padding:8px;
    background:transparent;border:1px solid #29445a;
    border-radius:6px;color:#20baf0;
    font-family:inherit;font-size:10px;
    font-weight:700;cursor:pointer;transition:.2s;
}

.copy-affiliate:hover{
    background:#102237;border-color:#20baf0;
}

/* VAZIO */
.empty{
    grid-column:1/-1;text-align:center;
    padding:55px 15px;background:#091522;
    border:1px solid #292929;border-radius:10px;
    color:#969eaa;
}

.empty span{display:block;font-size:35px;margin-bottom:12px}
.empty p{font-size:12px}

/* TABLET */
@media(max-width:900px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* CELULAR */
@media(max-width:700px){
    .top-toolbar{height:75px;padding:0 20px}

    .toolbar-button svg{width:27px;height:35px}

    .main{padding:22px 15px}

    .topbar{margin-bottom:24px}

    h1{font-size:20px}

    .search-box{height:44px}

    .category{padding:9px 14px}

    .grid{
        grid-template-columns:minmax(0,1fr);
        gap:17px;
    }

    .product{width:100%;border-radius:11px}

    .product-image{height:210px;padding:8px}
    .product-image.portrait{height:280px}
    .product-image.landscape{height:190px}
    .product-image.square{height:220px}

    .product-info{padding:16px}

    .product-info h4{
        font-size:15px;line-height:1.5;margin-bottom:8px;
    }

    .description{
        font-size:12px;line-height:1.7;
        margin-bottom:15px;-webkit-line-clamp:3;
    }

    .product-offers{gap:8px;margin-bottom:14px}

    .offer-tag{font-size:10px;padding:7px 10px}

    .product-bottom{margin-top:5px}

    .price{font-size:18px}

    .product-actions{margin-top:15px;gap:9px}

    .buy{
        min-height:43px;font-size:12px;border-radius:7px;
    }

    .copy-affiliate{
        min-height:40px;font-size:11px;border-radius:7px;
    }
}

/* ECRÃS PEQUENOS */
@media(max-width:350px){
    .product-info{padding:13px}
    .product-info h4{font-size:14px}
    .price{font-size:16px}
    .product-image.portrait{height:250px}
    .product-image.landscape{height:165px}
}
</style>
</head>

<body>

<nav class="top-toolbar">
    <div class="toolbar-left">
        <button class="toolbar-button"
                id="menuButton"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="sideMenu"
                type="button">
            <svg viewBox="0 0 24 24">
                <path d="M3 5h18"/>
                <path d="M3 12h18"/>
                <path d="M3 19h18"/>
            </svg>
        </button>
    </div>
</nav>

<div class="menu-overlay" id="menuOverlay"></div>

<aside class="side-menu" id="sideMenu" aria-label="Menu principal">
    <div class="menu-header">
        <img src="assets/klikpay.png"
             alt="KLIKPay" class="menu-logo">

        <button class="menu-close" id="menuClose"
                aria-label="Fechar menu" type="button">
            &times;
        </button>
    </div>

    <nav class="menu-links">
        <a href="dashboard.html">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="8" height="8" rx="1"/>
                <rect x="13" y="3" width="8" height="5" rx="1"/>
                <rect x="13" y="10" width="8" height="11" rx="1"/>
                <rect x="3" y="13" width="8" height="8" rx="1"/>
            </svg>
            Dashboard
        </a>

        <a href="produtos.html">
            <svg viewBox="0 0 24 24">
                <path d="m3 7 9-4 9 4-9 4-9-4Z"/>
                <path d="M3 7v10l9 4 9-4V7"/>
                <path d="M12 11v10"/>
            </svg>
            Produtos
        </a>

        <a href="vitrine.html" class="active" aria-current="page">
            <svg viewBox="0 0 24 24">
                <path d="M3 10h18l-2-6H5l-2 6Z"/>
                <path d="M4 10v10h16V10"/>
                <path d="M9 20v-6h6v6"/>
            </svg>
            Vitrine
        </a>

        <a href="financeiro.html">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="15" rx="2"/>
                <path d="M3 10h18"/>
                <path d="M16 15h2"/>
            </svg>
            Financeiro
        </a>

        <a href="#" id="logoutButton">
            <svg viewBox="0 0 24 24">
                <path d="M10 17l5-5-5-5"/>
                <path d="M15 12H3"/>
                <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/>
            </svg>
            Sair
        </a>
    </nav>
</aside>

<main class="main">

    <header class="topbar">
        <h1>Vitrine</h1>
        <p class="subtitle">Encontra os nossos produtos</p>
    </header>

    <div class="search-box">
        <span class="material-icons-outlined">search</span>
        <input type="text" id="pesquisa"
               placeholder="Pesquisar produtos...">
    </div>

    <div class="categories">
        <button class="category active" data-category="Todos">Todos</button>
        <button class="category" data-category="E-books">E-books</button>
        <button class="category" data-category="Cursos">Cursos</button>
        <button class="category" data-category="Mentorias">Mentorias</button>
        <button class="category" data-category="Outros">Outros</button>
    </div>

    <section>
        <div class="section-title">
            <h3>Todos os produtos</h3>
            <span id="contador">0 produtos</span>
        </div>

        <div class="grid" id="produtos">
            <div class="empty">
                <span class="material-icons-outlined">inventory_2</span>
                <p>A carregar produtos...</p>
            </div>
        </div>
    </section>

</main>

<script type="module">
import { auth, db } from "./js/firebase.js";

import {
    signOut
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
    collection,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

/* MENU */
const menuButton = document.getElementById("menuButton");
const menuClose = document.getElementById("menuClose");
const sideMenu = document.getElementById("sideMenu");
const menuOverlay = document.getElementById("menuOverlay");

function abrirMenu(){
    sideMenu.classList.add("active");
    menuOverlay.classList.add("active");
    menuButton.setAttribute("aria-expanded","true");
    document.body.style.overflow="hidden";
}

function fecharMenu(){
    sideMenu.classList.remove("active");
    menuOverlay.classList.remove("active");
    menuButton.setAttribute("aria-expanded","false");
    document.body.style.overflow="";
}

menuButton.addEventListener("click",abrirMenu);
menuClose.addEventListener("click",fecharMenu);
menuOverlay.addEventListener("click",fecharMenu);

document.addEventListener("keydown",event=>{
    if(event.key==="Escape") fecharMenu();
});

document.querySelectorAll(".menu-links a").forEach(link=>{
    link.addEventListener("click",fecharMenu);
});

/* SAIR */
document.getElementById("logoutButton").addEventListener("click",async event=>{
    event.preventDefault();

    try{
        await signOut(auth);
        window.location.replace("index.html");
    }catch(error){
        console.error("Erro ao sair:",error);
        alert("Não foi possível terminar a sessão.");
    }
});

/* ELEMENTOS */
const produtosContainer=document.getElementById("produtos");
const pesquisa=document.getElementById("pesquisa");
const contador=document.getElementById("contador");
const botoesCategoria=document.querySelectorAll(".category");

let todosProdutos=[];
let categoriaAtual="Todos";

/* MOEDA */
function formatarMoeda(valor){
    return Number(valor||0).toLocaleString("pt-MZ",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    })+" MT";
}

/* NORMALIZAR TEXTO */
function normalizar(texto){
    return String(texto||"")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();
}

/* CATEGORIAS */
function categoriaCompativel(produtoCategoria,filtro){
    if(filtro==="Todos") return true;

    const categoria=normalizar(produtoCategoria);

    if(filtro==="E-books"){
        return categoria.includes("ebook")||
               categoria.includes("e-book");
    }

    if(filtro==="Cursos") return categoria.includes("curso");
    if(filtro==="Mentorias") return categoria.includes("mentoria");

    if(filtro==="Outros"){
        return !categoria.includes("ebook")&&
               !categoria.includes("e-book")&&
               !categoria.includes("curso")&&
               !categoria.includes("mentoria");
    }

    return true;
}

/* LINK DE AFILIADO */
function gerarLinkAfiliado(produto,uid){
    const url=new URL(
        "/pagamento.html",
        window.location.origin
    );

    url.searchParams.set("produto",produto.id);
    url.searchParams.set("ref",uid);

    return url.toString();
}

/* COPIAR LINK */
async function copiarLinkAfiliado(produto,botao){
    const usuario=auth.currentUser;

    if(!usuario){
        alert("Inicia sessão para copiar o teu link de afiliado.");
        return;
    }

    if(produto.affiliate?.enabled!==true){
        alert("A afiliação não está ativada para este produto.");
        return;
    }

    const link=gerarLinkAfiliado(produto,usuario.uid);

    try{
        await navigator.clipboard.writeText(link);

        const textoOriginal=botao.innerHTML;

        botao.innerHTML=`
            <span class="material-icons-outlined"
                  style="font-size:16px">check</span>
            Link copiado!
        `;

        setTimeout(()=>{
            botao.innerHTML=textoOriginal;
        },2000);

    }catch(error){
        console.error("Erro ao copiar link:",error);
        alert("Não foi possível copiar o link. Tenta novamente.");
    }
}

/* DEFINIR FORMATO DA IMAGEM */
function adaptarImagem(img,area){
    function verificarFormato(){
        const largura=img.naturalWidth;
        const altura=img.naturalHeight;

        if(!largura||!altura) return;

        area.classList.remove("portrait","landscape","square");

        const proporcao=largura/altura;

        if(proporcao<0.85){
            area.classList.add("portrait");
        }else if(proporcao>1.20){
            area.classList.add("landscape");
        }else{
            area.classList.add("square");
        }
    }

    if(img.complete){
        verificarFormato();
    }else{
        img.addEventListener("load",verificarFormato,{once:true});
    }
}

/* RENDERIZAR PRODUTOS */
function renderizarProdutos(){
    const termo=normalizar(pesquisa.value);

    const filtrados=todosProdutos.filter(produto=>{
        const nome=normalizar(produto.nome);
        const descricao=normalizar(produto.descricao);

        const correspondePesquisa=
            nome.includes(termo)||descricao.includes(termo);

        const correspondeCategoria=
            categoriaCompativel(produto.categoria,categoriaAtual);

        return correspondePesquisa&&correspondeCategoria;
    });

    contador.textContent=
        filtrados.length+
        (filtrados.length===1?" produto":" produtos");

    produtosContainer.innerHTML="";

    if(!filtrados.length){
        produtosContainer.innerHTML=`
            <div class="empty">
                <span class="material-icons-outlined">inventory_2</span>
                <p>Nenhum produto encontrado.</p>
            </div>
        `;
        return;
    }

    filtrados.forEach(produto=>{
        const card=document.createElement("article");
        card.className="product";

        /* IMAGEM */
        const imagem=document.createElement("div");
        imagem.className="product-image";

        if(produto.imageFileId){
            const img=document.createElement("img");

            img.src="/api/image?fileId="+
                encodeURIComponent(produto.imageFileId);

            img.alt=produto.nome||"Produto";
            img.loading="lazy";

            img.onload=()=>adaptarImagem(img,imagem);

            img.onerror=()=>{
                imagem.classList.remove("portrait","landscape","square");
                imagem.innerHTML=`
                    <span class="material-icons-outlined">image</span>
                `;
            };

            imagem.appendChild(img);

            if(img.complete&&img.naturalWidth){
                adaptarImagem(img,imagem);
            }

        }else{
            imagem.innerHTML=`
                <span class="material-icons-outlined">image</span>
            `;
        }

        /* INFORMAÇÕES */
        const info=document.createElement("div");
        info.className="product-info";

        const nome=document.createElement("h4");
        nome.textContent=produto.nome||"Produto sem nome";

        const descricao=document.createElement("p");
        descricao.className="description";
        descricao.textContent=
            produto.descricao||"Sem descrição disponível.";

        /* OFERTAS */
        const ofertas=document.createElement("div");
        ofertas.className="product-offers";

        if(produto.orderBump?.enabled===true){
            const etiqueta=document.createElement("span");
            etiqueta.className="offer-tag";
            etiqueta.textContent="Order Bump";
            ofertas.appendChild(etiqueta);
        }

        if(produto.upsell?.enabled===true){
            const etiqueta=document.createElement("span");
            etiqueta.className="offer-tag upsell";
            etiqueta.textContent="Upsell";
            ofertas.appendChild(etiqueta);
        }

        /* PREÇO */
        const bottom=document.createElement("div");
        bottom.className="product-bottom";

        const preco=document.createElement("span");
        preco.className="price";
        preco.textContent=formatarMoeda(produto.preco);

        bottom.appendChild(preco);

        /* AÇÕES */
        const actions=document.createElement("div");
        actions.className="product-actions";

        const comprar=document.createElement("a");

        comprar.className="buy";
        comprar.textContent="Comprar";

        comprar.href=
            "/pagamento.html?produto="+
            encodeURIComponent(produto.id);

        comprar.addEventListener("click",event=>{
            if(!produto.id){
                event.preventDefault();
                alert("Não foi possível identificar este produto.");
            }
        });

        actions.appendChild(comprar);

        /* AFILIAÇÃO */
        if(produto.affiliate?.enabled===true){
            const copiar=document.createElement("button");

            copiar.type="button";
            copiar.className="copy-affiliate";

            copiar.innerHTML=`
                <span class="material-icons-outlined"
                      style="font-size:16px">content_copy</span>
                Copiar link de afiliado
            `;

            copiar.addEventListener("click",()=>{
                copiarLinkAfiliado(produto,copiar);
            });

            actions.appendChild(copiar);
        }

        /* MONTAR CARTÃO */
        info.appendChild(nome);
        info.appendChild(descricao);

        if(ofertas.children.length>0){
            info.appendChild(ofertas);
        }

        info.appendChild(bottom);
        info.appendChild(actions);

        card.appendChild(imagem);
        card.appendChild(info);

        produtosContainer.appendChild(card);
    });
}

/* PESQUISA */
pesquisa.addEventListener("input",renderizarProdutos);

/* CATEGORIAS */
botoesCategoria.forEach(botao=>{
    botao.addEventListener("click",()=>{
        botoesCategoria.forEach(item=>item.classList.remove("active"));

        botao.classList.add("active");
        categoriaAtual=botao.dataset.category;

        renderizarProdutos();
    });
});

/* CARREGAR PRODUTOS */
onSnapshot(collection(db,"produtos"),snapshot=>{
    todosProdutos=snapshot.docs
        .map(documento=>({
            id:documento.id,
            ...documento.data()
        }))
        .filter(produto=>
            produto.ativo!==false&&
            produto.status!=="inativo"
        );

    renderizarProdutos();

},error=>{
    console.error("Erro ao carregar produtos:",error);

    produtosContainer.innerHTML=`
        <div class="empty">
            <span class="material-icons-outlined">error_outline</span>
            <p>Não foi possível carregar os produtos.</p>
        </div>
    `;
});
</script>

</body>
</html>
