
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030a12">

<title>Criar conta | KILLIKPAY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#030a12;
    color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 16px;
}

/* ESTRUTURA PRINCIPAL */

.container{
    width:100%;
    max-width:340px;
    background:#071321;
    border:9px solid #000;
    border-radius:30px;
    overflow:hidden;
    position:relative;
    box-shadow:0 25px 65px rgba(0,0,0,.4);
}

.register-screen{
    min-height:650px;
    padding:28px 25px 25px;
    background:#071321;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* LOGOTIPO */

.logo-area{
    width:100%;
    min-height:125px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.logo{
    width:150px;
    max-height:75px;
    object-fit:contain;
}

.brand-caption{
    color:#969eaa;
    font-size:9px;
    letter-spacing:1.2px;
    margin-top:9px;
    text-transform:uppercase;
}

/* FORMULÁRIO */

.form-area{
    width:100%;
    margin-top:5px;
}

.title{
    text-align:center;
    font-size:18px;
    font-weight:800;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    font-size:10px;
    color:#969eaa;
    line-height:1.6;
    margin-bottom:20px;
}

/* MENSAGENS */

.message{
    display:none;
    width:100%;
    padding:11px 13px;
    border-radius:10px;
    font-size:10px;
    line-height:1.5;
    margin-bottom:13px;
}

.message.error{
    display:block;
    background:#351616;
    color:#ffb0b0;
    border:1px solid #572323;
}

.message.success{
    display:block;
    background:#102b20;
    color:#a5f3c0;
    border:1px solid #205338;
}

/* CAMPOS */

.field{
    width:100%;
    margin-bottom:12px;
    position:relative;
}

label{
    display:block;
    font-size:10px;
    color:#c6d0da;
    font-weight:700;
    margin:0 0 7px 5px;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#969eaa;
    width:15px;
    height:15px;
    pointer-events:none;
}

input{
    width:100%;
    height:44px;
    border:1px solid #292929;
    outline:none;
    border-radius:10px;
    background:#030a12;
    color:#fff;
    padding:0 17px 0 43px;
    font-family:inherit;
    font-size:10px;
    transition:.2s;
}

input::placeholder{
    color:#687482;
}

input:focus{
    border-color:#20baf0;
    box-shadow:0 0 0 3px rgba(32,186,240,.1);
}

.password-input{
    padding-right:70px;
}

.toggle{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:#20baf0;
    font-family:inherit;
    font-size:9px;
    font-weight:700;
    cursor:pointer;
}

.help{
    font-size:9px;
    color:#657080;
    margin:6px 0 0 6px;
}

/* BOTÃO */

.register-btn{
    width:100%;
    height:46px;
    border:none;
    border-radius:30px;
    background:#20baf0;
    color:#030a12;
    font-family:inherit;
    font-size:10px;
    font-weight:800;
    letter-spacing:.4px;
    cursor:pointer;
    margin-top:7px;
    transition:.2s;
}

.register-btn:hover{
    background:#55cbf5;
}

.register-btn:disabled{
    opacity:.6;
    cursor:wait;
}

/* ENTRAR */

.login-link{
    text-align:center;
    color:#969eaa;
    font-size:9px;
    margin-top:23px;
}

.login-link a{
    color:#20baf0;
    font-weight:800;
    text-decoration:none;
}

/* RODAPÉ */

.footer{
    text-align:center;
    color:#657080;
    font-size:8px;
    margin-top:auto;
    padding-top:22px;
}

/* RESPONSIVIDADE */

@media(max-height:760px){

    body{
        align-items:flex-start;
    }

    .register-screen{
        padding-top:22px;
        padding-bottom:20px;
    }

    .logo-area{
        min-height:105px;
    }

    .logo{
        max-height:65px;
    }

    .subtitle{
        margin-bottom:15px;
    }

    .field{
        margin-bottom:9px;
    }
}

@media(max-width:360px){

    .container{
        max-width:320px;
    }

    .register-screen{
        padding-left:20px;
        padding-right:20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <main class="register-screen">

        <!-- LOGOTIPO -->

        <div class="logo-area">

            <img
                src="assets/lowticketpay.png"
                alt="KILLIKPAY"
                class="logo"
            >

       

        </div>

        <!-- FORMULÁRIO -->

        <div class="form-area">

            <h1 class="title">Criar uma conta</h1>

            <p class="subtitle">
                Preencha os seus dados para começar a utilizar a KILLIKPAY.
            </p>

            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite">
            </div>

            <form id="registerForm">

                <!-- NOME -->

                <div class="field">

                    <label for="name">Nome completo</label>

                    <div class="input-wrap">

                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                        </svg>

                        <input
                            type="text"
                            id="name"
                            placeholder="O seu nome"
                            autocomplete="name"
                            maxlength="100"
                            required
                        >

                    </div>

                </div>

                <!-- EMAIL -->

                <div class="field">

                    <label for="email">E-mail</label>

                    <div class="input-wrap">

                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="m3 7 9 6 9-6"/>
                        </svg>

                        <input
                            type="email"
                            id="email"
                            placeholder="seuemail@exemplo.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>

                <!-- PALAVRA-PASSE -->

                <div class="field">

                    <label for="password">Palavra-passe</label>

                    <div class="input-wrap">

                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <rect x="5" y="10" width="14" height="11" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                        </svg>

                        <input
                            type="password"
                            id="password"
                            class="password-input"
                            placeholder="Crie uma palavra-passe"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="toggle"
                            id="togglePassword">
                            Mostrar
                        </button>

                    </div>

                    <p class="help">Mínimo de 6 caracteres.</p>

                </div>

                <!-- CONFIRMAR PALAVRA-PASSE -->

                <div class="field">

                    <label for="confirmPassword">
                        Confirmar palavra-passe
                    </label>

                    <div class="input-wrap">

                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <rect x="5" y="10" width="14" height="11" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            <path d="m9 15 2 2 4-4"/>
                        </svg>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="password-input"
                            placeholder="Repita a palavra-passe"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle"
                            id="toggleConfirm">
                            Mostrar
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="register-btn"
                    id="registerBtn">
                    CRIAR MINHA CONTA
                </button>

            </form>

            <div class="login-link">
                Já tem uma conta?
                <a href="index.html">Entrar</a>
            </div>

        </div>

        <div class="footer">
            © 2026 KILLIKPAY. Todos os direitos reservados.
        </div>

    </main>

</div>

<!-- FIREBASE -->

<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const form = document.getElementById("registerForm");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");

const registerBtn = document.getElementById("registerBtn");
const message = document.getElementById("message");

let submitting = false;

/* MENSAGENS */

function showMessage(text,type="error"){

    message.textContent = text;
    message.className = "message " + type;

}

function translateError(error){

    const errors = {

        "auth/email-already-in-use":
            "Este e-mail já está registado. Entre na sua conta.",

        "auth/invalid-email":
            "O e-mail introduzido é inválido.",

        "auth/weak-password":
            "A palavra-passe é demasiado fraca.",

        "auth/network-request-failed":
            "Erro de ligação. Verifique a internet.",

        "auth/operation-not-allowed":
            "O registo por e-mail não está activado no Firebase.",

        "auth/too-many-requests":
            "Demasiadas tentativas. Tente novamente mais tarde."

    };

    return errors[error.code] ||
        "Não foi possível criar a conta. Tente novamente.";

}

/* MOSTRAR / OCULTAR SENHAS */

document.getElementById("togglePassword").addEventListener("click",()=>{

    const visible = passwordInput.type === "text";

    passwordInput.type = visible ? "password" : "text";

    document.getElementById("togglePassword").textContent =
        visible ? "Mostrar" : "Ocultar";

});

document.getElementById("toggleConfirm").addEventListener("click",()=>{

    const visible = confirmInput.type === "text";

    confirmInput.type = visible ? "password" : "text";

    document.getElementById("toggleConfirm").textContent =
        visible ? "Mostrar" : "Ocultar";

});

/* CRIAR CONTA */

form.addEventListener("submit",async event=>{

    event.preventDefault();

    if(submitting) return;

    const name = nameInput.value.trim();
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    /* VALIDAR CAMPOS */

    if(!name || !email || !password || !confirmPassword){

        showMessage("Preencha todos os campos.");
        return;

    }

    if(name.length < 2){

        showMessage("Introduza um nome válido.");
        return;

    }

    if(password.length < 6){

        showMessage("A palavra-passe deve ter pelo menos 6 caracteres.");
        return;

    }

    if(password !== confirmPassword){

        showMessage("As palavras-passe não coincidem.");
        return;

    }

    submitting = true;

    registerBtn.disabled = true;
    registerBtn.textContent = "A CRIAR CONTA...";

    message.className = "message";

    let createdUser = null;

    try{

        /* 1. CRIAR CONTA NO FIREBASE AUTHENTICATION */

        const credential = await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        createdUser = credential.user;

        /* 2. ACTUALIZAR NOME */

        await updateProfile(createdUser,{
            displayName:name
        });

        /* 3. GUARDAR PERFIL NO FIRESTORE */

        await setDoc(
            doc(db,"usuarios",createdUser.uid),
            {
                uid:createdUser.uid,
                nome:name,
                email:email,
                createdAt:serverTimestamp()
            }
        );

        /* 4. CONFIRMAR REGISTO */

        showMessage(
            "Conta criada com sucesso! A abrir o painel...",
            "success"
        );

        window.location.replace("dashboard.html");

    }catch(error){

        console.error("Erro no registo:",error);

        if(createdUser){

            showMessage(
                "A conta foi criada no Firebase Authentication, mas ocorreu um erro ao guardar o perfil. Não tente criar outra conta. Verifique as regras do Firestore."
            );

        }else{

            showMessage(translateError(error));

        }

        submitting = false;

        registerBtn.disabled = false;
        registerBtn.textContent = "CRIAR MINHA CONTA";

    }

});

</script>

</body>
</html>
