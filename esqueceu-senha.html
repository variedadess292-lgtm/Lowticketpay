
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030a12">

<title>Recuperar senha | KILLIKPAY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #030a12;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
}

.panel {
    width: 100%;
    max-width: 370px;
    background: #071321;
    border: 9px solid #000;
    border-radius: 49px;
    padding: 38px 23px 32px;
}

.logo {
    display: block;
    width: 175px;
    max-width: 80%;
    height: auto;
    object-fit: contain;
    margin: 0 auto 35px;
}

h1 {
    font-size: 23px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    color: #969eaa;
    font-size: 12px;
    line-height: 1.7;
    text-align: center;
    margin-bottom: 28px;
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 9px;
}

input {
    width: 100%;
    height: 49px;
    padding: 0 14px;
    background: #030a12;
    border: 1px solid #292929;
    border-radius: 11px;
    outline: none;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    transition: .2s;
}

input:focus {
    border-color: #20baf0;
}

input::placeholder {
    color: #68717d;
}

button.submit {
    width: 100%;
    height: 49px;
    background: #20baf0;
    color: #00111b;
    border: none;
    border-radius: 11px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 7px;
    transition: .2s;
}

button.submit:hover {
    opacity: .9;
}

button.submit:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 11px;
    line-height: 1.6;
    margin-bottom: 17px;
}

.message.error {
    display: block;
    background: rgba(255, 70, 70, .10);
    border: 1px solid rgba(255, 70, 70, .3);
    color: #ff7777;
}

.message.success {
    display: block;
    background: rgba(32, 186, 120, .10);
    border: 1px solid rgba(32, 186, 120, .3);
    color: #42d99b;
}

.back {
    display: block;
    text-align: center;
    color: #20baf0;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    margin-top: 23px;
}

.back:hover {
    opacity: .8;
}

.footer {
    text-align: center;
    color: #68717d;
    font-size: 10px;
    margin-top: 27px;
}

@media (max-height: 650px) {
    body {
        align-items: flex-start;
    }

    .panel {
        margin: 10px auto;
        padding-top: 25px;
    }

    .logo {
        margin-bottom: 22px;
    }
}
</style>
</head>

<body>

<div class="panel">

    <img
        src="assets/lowticketpay.png"
        alt="KILLIKPAY"
        class="logo"
    >

    <h1>Recuperar senha</h1>

    <p class="subtitle">
        Não te lembras da tua senha?
        Introduz o teu e-mail e enviaremos um link
        para criares uma nova senha.
    </p>

    <div id="message" class="message"></div>

    <form id="recoveryForm">

        <div class="field">
            <label for="email">E-mail da conta</label>

            <input
                type="email"
                id="email"
                placeholder="exemplo@email.com"
                autocomplete="email"
                required
            >
        </div>

        <button
            type="submit"
            class="submit"
            id="submitButton"
        >
            ENVIAR LINK DE RECUPERAÇÃO
        </button>

    </form>

    <a href="index.html" class="back">
        Voltar ao Login
    </a>

    <div class="footer">
        © KILLIKPAY — Todos os direitos reservados.
    </div>

</div>

<script type="module">

import { auth } from "./js/firebase.js";

import {
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


const form = document.getElementById("recoveryForm");
const emailInput = document.getElementById("email");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");


function showMessage(text, type) {

    message.textContent = text;
    message.className = "message " + type;
}


form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email = emailInput.value.trim();

    if (!email) {

        showMessage(
            "Introduz o teu endereço de e-mail.",
            "error"
        );

        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "A ENVIAR...";

    try {

        await sendPasswordResetEmail(
            auth,
            email,
            {
                url: "https://lowticketpay.vercel.app/nova-senha.html"
            }
        );

        showMessage(
            "Se existir uma conta associada a este e-mail, receberás uma mensagem com as instruções de recuperação. Verifica também a caixa de spam.",
            "success"
        );

        form.reset();

    } catch (error) {

        console.error(
            "Erro na recuperação de senha:",
            error
        );

        let errorMessage =
            "Não foi possível enviar o link. Tenta novamente mais tarde.";

        if (error.code === "auth/invalid-email") {
            errorMessage = "O endereço de e-mail não é válido.";
        }

        if (
            error.code === "auth/too-many-requests"
        ) {
            errorMessage =
                "Muitos pedidos. Aguarda alguns minutos e tenta novamente.";
        }

        if (
            error.code === "auth/unauthorized-continue-uri"
        ) {
            errorMessage =
                "O endereço de recuperação ainda não está autorizado no Firebase.";
        }

        showMessage(errorMessage, "error");

    } finally {

        submitButton.disabled = false;
        submitButton.textContent =
            "ENVIAR LINK DE RECUPERAÇÃO";

    }

});

</script>

</body>
</html>
